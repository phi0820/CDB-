<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共鳴判定</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:20px;background:#f5f5f5;color:#222}
  .card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}
  h1{text-align:center}.num{font-size:48px;font-weight:bold;text-align:center;margin:10px}
  button,input{font-size:18px;padding:10px;border-radius:10px;border:1px solid #bbb}
  button{cursor:pointer;background:#eee}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .status{text-align:center;font-size:28px;font-weight:bold;padding:14px;border-radius:12px;background:#eee}
  .resonance{background:#dff7df}.odd{background:#ffe4e4}
  li{margin:8px 0;display:flex;justify-content:space-between;align-items:center}
  .small{font-size:14px;color:#666}
</style>
</head>
<body>
<h1>共鳴判定</h1>

<div class="card">
  <h2>現在の山札</h2>
  <div class="num" id="deck">40</div>
  <div class="row">
    <button onclick="changeDeck(-5)">−5</button>
    <button onclick="changeDeck(-1)">−1</button>
    <button onclick="changeDeck(1)">＋1</button>
    <button onclick="changeDeck(5)">＋5</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="deckInput" type="number" placeholder="増減数">
    <button onclick="changeByInput()">増減</button>
  </div>
  <p class="small">40枚から開始。山札が偶数なら「共鳴」。</p>
  <div id="deckStatus" class="status resonance">共鳴</div>
</div>

<div class="card">
  <h2>破壊されたアーティファクト</h2>
  <div class="num" id="artifactCount">0</div>
  <div class="row">
    <input id="artifactInput" placeholder="アーティファクト名">
    <button onclick="addArtifact()">破壊を記録</button>
  </div>
  <p class="small">入力した種類はブラウザに保存され、ページを閉じても残ります。</p>
  <div id="artifactStatus" class="status resonance">偶数</div>
  <ul id="artifactList"></ul>
</div>

<div class="card">
  <h2>判定まとめ</h2>
  <div id="summary" class="status resonance">共鳴</div>
  <p class="small">「共鳴」は現在の山札の枚数が偶数のときに表示されます。</p>
</div>

<div class="row">
  <button onclick="resetAll()">すべてリセット</button>
</div>

<script>
let deck = Number(localStorage.getItem("deckCount"));
if (!Number.isFinite(deck)) deck = 40;

let artifacts = JSON.parse(localStorage.getItem("artifacts") || "{}");

function save(){
  localStorage.setItem("deckCount", deck);
  localStorage.setItem("artifacts", JSON.stringify(artifacts));
}

function changeDeck(n){
  deck += n;
  if(deck < 0) deck = 0;
  save(); render();
}

function changeByInput(){
  const n = Number(document.getElementById("deckInput").value);
  if(Number.isFinite(n)){ changeDeck(n); document.getElementById("deckInput").value=""; }
}

function addArtifact(){
  const input=document.getElementById("artifactInput");
  const name=input.value.trim();
  if(!name) return;
  artifacts[name]=(artifacts[name]||0)+1;
  input.value="";
  save(); render();
}

function removeArtifact(name){
  if(artifacts[name] > 1) artifacts[name]--;
  else delete artifacts[name];
  save(); render();
}

function render(){
  document.getElementById("deck").textContent=deck;
  const even=deck%2===0;
  const ds=document.getElementById("deckStatus");
  ds.textContent=even?"共鳴":"非共鳴";
  ds.className="status "+(even?"resonance":"odd");

  const total=Object.values(artifacts).reduce((a,b)=>a+b,0);
  document.getElementById("artifactCount").textContent=total;
  const as=document.getElementById("artifactStatus");
  as.textContent=total%2===0?"偶数":"奇数";
  as.className="status "+(total%2===0?"resonance":"odd");

  const list=document.getElementById("artifactList");
  list.innerHTML="";
  Object.entries(artifacts).forEach(([name,count])=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>${escapeHtml(name)} × ${count}</span>
      <button onclick='removeArtifact(${JSON.stringify(name)})'>−1</button>`;
    list.appendChild(li);
  });

  const summary=document.getElementById("summary");
  summary.textContent=even?"共鳴":"非共鳴";
  summary.className="status "+(even?"resonance":"odd");
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function resetAll(){
  if(confirm("山札とアーティファクトの記録をすべてリセットしますか？")){
    deck=40; artifacts={}; save(); render();
  }
}

render();
</script>
</body>
</html>
